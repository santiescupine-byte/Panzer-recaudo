const API_URL = 'https://script.google.com/macros/s/AKfycbyANxSp6rnaIY9UZxHlT3TzENnxpmbS8oDtUSxYZ5TTmgvDdhshQS2KZ2XAaS7AmnAq/exec';

async function apiGet(action, params = {}) {
  const url = new URL(API_URL);
  url.searchParams.set('action', action);
  for (const [k, v] of Object.entries(params)) url.searchParams.set(k, v);
  try {
    const res = await fetch(url.toString());
    return await res.json();
  } catch (e) {
    console.error('API GET error:', e);
    return null;
  }
}

async function apiPost(data) {
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(data),
    });
    return await res.json();
  } catch (e) {
    console.error('API POST error:', e);
    return null;
  }
}

function App() {
  // Navigation
  const [tab, setTab] = useState("inicio");
  const [subPage, setSubPage] = useState(null);

  // API state
  const [apiConfig, setApiConfig] = useState(null);
  const [apiLoading, setApiLoading] = useState(false);
  const [apiMsg, setApiMsg] = useState(null);
  const [histMaq, setHistMaq] = useState({});
  const [histTok, setHistTok] = useState({});

  // Cargar configuración desde Google Sheets al abrir
  useEffect(() => {
    setApiLoading(true);
    apiGet('getConfig').then(data => {
      if (data && data.sedes) {
        CONFIG.tesoreros = data.tesoreros || CONFIG.tesoreros;
        const newSedes = {};
        for (const [k, v] of Object.entries(data.sedes)) {
          newSedes[k] = { base: v.base || 1000000, operadores: v.operadores || [], maquinas: v.maquinas || [] };
        }
        CONFIG.sedes = newSedes;
        setApiConfig(data);
      }
      setApiLoading(false);
    }).catch(() => setApiLoading(false));
  }, []);

  // ============================================================
  // AUTOGUARDADO LOCAL - Protege contra cierre accidental
  // ============================================================
  const STORAGE_KEY = 'panzer_ciclo_progreso';

  const guardarLocal = useCallback((datos) => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(datos));
    } catch(e) {}
  }, []);

  const cargarLocal = () => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch(e) { return null; }
  };

  const borrarLocal = () => {
    try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
  };

  // Cycle state
  const [ciclo, setCiclo] = useState(null);
  const [liquidaciones, setLiquidaciones] = useState([]);
  const [maquinas, setMaquinas] = useState([]);
  const [gastos, setGastos] = useState([]);
  const [tokenReparto, setTokenReparto] = useState([]);
  const [conteoFisico, setConteoFisico] = useState({ tokensFisicos: "", efectivoTotal: "" });
  const [showRestore, setShowRestore] = useState(false);
  const [savedData, setSavedData] = useState(null);

  // Al abrir: verificar si hay ciclo guardado
  useEffect(() => {
    const datos = cargarLocal();
    if (datos && datos.ciclo && datos.ciclo.estado === 'abierto') {
      setSavedData(datos);
      setShowRestore(true);
    }
  }, []);

  // Autoguardar cada vez que cambia algo del ciclo
  useEffect(() => {
    if (ciclo && ciclo.estado === 'abierto') {
      guardarLocal({ ciclo, liquidaciones, maquinas, gastos, tokenReparto, conteoFisico, tab });
    }
  }, [ciclo, liquidaciones, maquinas, gastos, tokenReparto, conteoFisico, tab, guardarLocal]);

  const restaurarCiclo = async () => {
    if (savedData) {
      setCiclo(savedData.ciclo);
      setLiquidaciones(savedData.liquidaciones || []);
      setMaquinas(savedData.maquinas || []);
      setGastos(savedData.gastos || []);
      setTokenReparto(savedData.tokenReparto || []);
      setConteoFisico(savedData.conteoFisico || { tokensFisicos: "", efectivoTotal: "" });
      setTab(savedData.tab || "liquidaciones");

      // Cargar historiales de la sede (igual que startCiclo)
      if (savedData.ciclo?.sede) {
        setApiLoading(true);
        try {
          const [hm, ht] = await Promise.all([
            apiGet('getHistorialMaquinas', { sede: savedData.ciclo.sede }),
            apiGet('getHistorialTokens', { sede: savedData.ciclo.sede }),
          ]);
          if (hm) { HISTORIAL_MAQUINAS[savedData.ciclo.sede] = hm; setHistMaq(hm); }
          if (ht) { HISTORIAL_TOKENS_OPERADOR[savedData.ciclo.sede] = ht; setHistTok(ht); }
        } catch(e) {}
        setApiLoading(false);
      }
    }
    setShowRestore(false);
    setSavedData(null);
  };

  const descartarCiclo = () => {
    borrarLocal();
    setShowRestore(false);
    setSavedData(null);
  };

  // Editing state
  const [editingLiq, setEditingLiq] = useState(null);
  const [editingMaq, setEditingMaq] = useState(null);
  const [editingGasto, setEditingGasto] = useState(null);

  const startCiclo = async (sede, tesorero) => {
    // Cargar historiales de la sede desde API
    setApiLoading(true);
    try {
      const [hm, ht] = await Promise.all([
        apiGet('getHistorialMaquinas', { sede }),
        apiGet('getHistorialTokens', { sede }),
      ]);
      if (hm) { HISTORIAL_MAQUINAS[sede] = hm; setHistMaq(hm); }
      if (ht) { HISTORIAL_TOKENS_OPERADOR[sede] = ht; setHistTok(ht); }
    } catch(e) {}
    setApiLoading(false);

    setCiclo({
      id: Date.now(),
      sede,
      tesorero,
      fecha: new Date().toLocaleDateString("es-CO"),
      hora: new Date().toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" }),
      estado: "abierto",
    });
    setLiquidaciones([]);
    setMaquinas([]);
    setGastos([]);
    setTokenReparto([]);
    setConteoFisico({ tokensFisicos: "", efectivoTotal: "" });
    setTab("liquidaciones");
  };

  const closeCiclo = async () => {
    // Guardar todo en Google Sheets
    setApiLoading(true);
    setApiMsg("Guardando en Google Sheets...");
    try {
      const result = await apiPost({
        action: 'guardarCiclo',
        ciclo,
        liquidaciones,
        maquinas,
        conteoFisico,
        gastos,
        tokenReparto,
      });
      if (result?.success) {
        setApiMsg("✅ Guardado exitosamente — ID: " + result.cicloId);
        borrarLocal(); // Limpiar autoguardado al enviar exitosamente
      } else {
        setApiMsg("⚠️ Error al guardar: " + (result?.error || "Sin conexión"));
      }
    } catch(e) {
      setApiMsg("⚠️ Error de conexión");
    }
    setApiLoading(false);

    setCiclo(prev => ({ ...prev, estado: "cerrado" }));
    setTab("resumen");
    setSubPage("resumen-final");
  };

  // Calculated totals
  const sumaTokenDiaMaq = maquinas.reduce((s, m) => s + (Number(m.tokenDia) || 0), 0);
  const sumaMoneDiaMaq = maquinas.reduce((s, m) => s + (Number(m.moneDia) || 0), 0);
  const tokensFisicoGlobal = Number(conteoFisico.tokensFisicos) || 0;
  const valorMonedasGlobal = Number(conteoFisico.efectivoTotal) || 0;

  const totales = {
    valorLiq: liquidaciones.reduce((s, l) => s + (Number(l.valor) || 0), 0),
    qr: liquidaciones.reduce((s, l) => s + (Number(l.qr) || 0), 0),
    devoluciones: liquidaciones.reduce((s, l) => s + (Number(l.devoluciones) || 0), 0),
    tokens: liquidaciones.reduce((s, l) => s + (Number(l.tokensVendidos) || 0), 0),
    efectivoLiq: liquidaciones.reduce((s, l) => s + (Number(l.efectivo) || 0), 0),
    producidoMaq: maquinas.reduce((s, m) => s + (Number(m.producido) || 0), 0),
    tokensMaq: tokensFisicoGlobal,
    sumaTokenDiaMaq,
    sumaMoneDiaMaq,
    valorMonedasGlobal,
    difTokensGlobal: sumaTokenDiaMaq - tokensFisicoGlobal,
    difDineroGlobal: sumaMoneDiaMaq - valorMonedasGlobal,
    totalGastos: gastos.reduce((s, g) => s + (Number(g.monto) || 0), 0),
  };
  totales.totalRecaudo = totales.efectivoLiq + valorMonedasGlobal;
  totales.aConsignar = totales.efectivoLiq + valorMonedasGlobal - totales.totalGastos;

  // Navigate helper
  const goBack = () => {
    if (subPage) { setSubPage(null); setEditingLiq(null); setEditingMaq(null); setEditingGasto(null); }
  };

  const currentTitle = () => {
    if (subPage === "nueva-liq") return editingLiq?.id ? "Editar Liquidación" : "Nueva Liquidación";
    if (subPage === "nuevo-conteo") return editingMaq?.id ? "Editar Máquina" : "Conteo de Máquina";
    if (subPage === "conteo-fisico") return "Conteo Físico General";
    if (subPage === "nuevo-gasto") return "Registrar Gasto";
    if (subPage === "resumen-final") return "Resumen del Ciclo";
    if (subPage === "reparto") return "Repartir Tokens";
    if (tab === "inicio") return null;
    if (tab === "liquidaciones") return "Liquidaciones";
    if (tab === "maquinas") return "Conteo Máquinas";
    if (tab === "resumen") return "Conciliación";
    return null;
  };

  // ============================================================
  // RENDER
  // ============================================================
  return (
    <div style={S.app}>
      {/* HEADER */}
      {(ciclo || subPage) && (
        <div style={S.header}>
          {subPage && (
            <button style={S.backBtn} onClick={goBack}>{Icons.back}</button>
          )}
          <div style={{ flex: 1, display: "flex", alignItems: "center", gap: 10 }}>
            <img src="https://santiescupine-byte.github.io/panzer-vip/Panzer%20Logo%20FINAL.png" alt="P" style={{ height: 28 }} />
            <div>
              <h1 style={S.headerTitle}>{currentTitle() || "Panzer Carwash"}</h1>
            {ciclo && !subPage && (
              <p style={S.headerSub}>{ciclo.sede} · {ciclo.fecha} · {ciclo.tesorero}</p>
            )}
            </div>
          </div>
          {ciclo && (
            <span style={S.badge(
              ciclo.estado === "abierto" ? colors.green : colors.textDim,
              ciclo.estado === "abierto" ? colors.greenDim : colors.surface2
            )}>
              {ciclo.estado === "abierto" ? "● Abierto" : "● Cerrado"}
            </span>
          )}
        </div>
      )}

      {/* LOADING & API MESSAGES */}

      {/* DIÁLOGO DE RESTAURACIÓN */}
      {showRestore && savedData && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.8)", zIndex: 200, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
          <div style={{ background: colors.surface, border: `1px solid ${colors.accent}`, borderRadius: 18, padding: 24, maxWidth: 380, width: "100%" }}>
            <div style={{ textAlign: "center", marginBottom: 20 }}>
              <div style={{ fontSize: 40, marginBottom: 10 }}>💾</div>
              <h2 style={{ fontSize: 18, fontWeight: 800, color: colors.textBright, margin: "0 0 8px" }}>Ciclo en progreso encontrado</h2>
              <p style={{ fontSize: 13, color: colors.textDim, lineHeight: 1.6 }}>
                Tienes un ciclo sin terminar de <strong style={{ color: colors.accent }}>{savedData.ciclo.sede}</strong> del {savedData.ciclo.fecha}.
              </p>
            </div>

            <div style={{ background: colors.surface2, borderRadius: 12, padding: 14, marginBottom: 16, border: `1px solid ${colors.border}` }}>
              <div style={{ fontSize: 12, color: colors.textDim, marginBottom: 8, fontWeight: 700 }}>Datos guardados:</div>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, color: colors.textBright, marginBottom: 4 }}>
                <span>Tesorero</span><span style={{ fontWeight: 700 }}>{savedData.ciclo.tesorero}</span>
              </div>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, color: colors.textBright, marginBottom: 4 }}>
                <span>Liquidaciones</span><span style={{ fontWeight: 700, color: colors.green }}>{(savedData.liquidaciones || []).length}</span>
              </div>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, color: colors.textBright, marginBottom: 4 }}>
                <span>Máquinas</span><span style={{ fontWeight: 700, color: colors.blue }}>{(savedData.maquinas || []).length}</span>
              </div>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, color: colors.textBright }}>
                <span>Gastos</span><span style={{ fontWeight: 700, color: colors.red }}>{(savedData.gastos || []).length}</span>
              </div>
            </div>

            <button style={{ ...S.btnPrimary, marginBottom: 10 }} onClick={restaurarCiclo}>
              ✅ Continuar donde iba
            </button>
            <button style={S.btnDanger} onClick={descartarCiclo}>
              🗑️ Descartar y empezar nuevo
            </button>
          </div>
        </div>
      )}
      {apiLoading && (
        <div style={{ padding: "12px 20px", background: colors.accentDim, display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ width: 16, height: 16, border: "2px solid " + colors.border, borderTopColor: colors.accent, borderRadius: "50%", animation: "spin 0.8s linear infinite" }} />
          <span style={{ fontSize: 13, color: colors.accent }}>{apiMsg || "Conectando con Google Sheets..."}</span>
        </div>
      )}
      {apiMsg && !apiLoading && (
        <div style={{ padding: "10px 20px", background: apiMsg.includes("✅") ? colors.greenDim : colors.redDim, fontSize: 12, color: apiMsg.includes("✅") ? colors.green : colors.red }}
          onClick={() => setApiMsg(null)}>
          {apiMsg} <span style={{ float: "right", cursor: "pointer" }}>✕</span>
        </div>
      )}

      {/* CONTENT */}
      <div style={S.page}>
        {!ciclo && tab === "inicio" && (
          <InicioPage onStart={startCiclo} apiConfig={apiConfig} apiLoading={apiLoading} />
        )}

        {ciclo && tab === "liquidaciones" && !subPage && (
          <LiquidacionesList
            items={liquidaciones}
            onAdd={() => { setEditingLiq({}); setSubPage("nueva-liq"); }}
            onEdit={(l) => { setEditingLiq(l); setSubPage("nueva-liq"); }}
            onDelete={(id) => setLiquidaciones(prev => prev.filter(l => l.id !== id))}
          />
        )}

        {ciclo && subPage === "nueva-liq" && (
          <LiquidacionForm
            initial={editingLiq}
            index={editingLiq?.id ? liquidaciones.findIndex(l => l.id === editingLiq.id) + 1 : liquidaciones.length + 1}
            sede={ciclo.sede}
            onSave={(liq) => {
              if (liq.id) {
                setLiquidaciones(prev => prev.map(l => l.id === liq.id ? liq : l));
              } else {
                setLiquidaciones(prev => [...prev, { ...liq, id: Date.now() }]);
              }
              setSubPage(null); setEditingLiq(null);
            }}
          />
        )}

        {ciclo && tab === "maquinas" && !subPage && (
          <MaquinasList
            items={maquinas}
            conteoFisico={conteoFisico}
            totales={totales}
            onAdd={() => { setEditingMaq({}); setSubPage("nuevo-conteo"); }}
            onEdit={(m) => { setEditingMaq(m); setSubPage("nuevo-conteo"); }}
            onDelete={(id) => setMaquinas(prev => prev.filter(m => m.id !== id))}
            onConteoFisico={() => setSubPage("conteo-fisico")}
          />
        )}

        {ciclo && subPage === "nuevo-conteo" && (
          <MaquinaForm
            initial={editingMaq}
            sede={ciclo.sede}
            maquinasYaRegistradas={maquinas.map(m => m.nombre)}
            onSave={(maq) => {
              if (maq.id) {
                setMaquinas(prev => prev.map(m => m.id === maq.id ? maq : m));
              } else {
                setMaquinas(prev => [...prev, { ...maq, id: Date.now() }]);
              }
              setSubPage(null); setEditingMaq(null);
            }}
          />
        )}

        {ciclo && subPage === "conteo-fisico" && (
          <ConteoFisicoGlobal
            maquinas={maquinas}
            conteoFisico={conteoFisico}
            totales={totales}
            onSave={(cf) => { setConteoFisico(cf); setSubPage(null); }}
          />
        )}

        {ciclo && tab === "resumen" && !subPage && (
          <ResumenPage
            ciclo={ciclo}
            totales={totales}
            liquidaciones={liquidaciones}
            maquinas={maquinas}
            gastos={gastos}
            onAddGasto={() => setSubPage("nuevo-gasto")}
            onDeleteGasto={(id) => setGastos(prev => prev.filter(g => g.id !== id))}
            onReparto={() => setSubPage("reparto")}
            onClose={closeCiclo}
          />
        )}

        {ciclo && subPage === "nuevo-gasto" && (
          <GastoForm
            onSave={(g) => {
              setGastos(prev => [...prev, { ...g, id: Date.now() }]);
              setSubPage(null);
            }}
          />
        )}

        {ciclo && subPage === "reparto" && (
          <RepartoTokens
            liquidaciones={liquidaciones}
            tokensMaq={totales.tokensMaq}
            sede={ciclo.sede}
            gastos={gastos}
            historialTokens={histTok}
            onSave={(reparto) => { setTokenReparto(reparto); setSubPage(null); }}
          />
        )}

        {ciclo && subPage === "resumen-final" && (
          <ResumenFinal
            ciclo={ciclo}
            totales={totales}
            liquidaciones={liquidaciones}
            maquinas={maquinas}
            gastos={gastos}
            tokenReparto={tokenReparto}
            onNewCiclo={() => {
              setCiclo(null); setLiquidaciones([]); setMaquinas([]);
              setGastos([]); setTokenReparto([]);
              setConteoFisico({ tokensFisicos: "", efectivoTotal: "" });
              setTab("inicio"); setSubPage(null);
            }}
          />
        )}
      </div>

      {/* BOTTOM NAVBAR */}
      {ciclo && ciclo.estado === "abierto" && !subPage && (
        <div style={S.navbar}>
          {[
            { id: "liquidaciones", icon: Icons.receipt, label: "Liquidaciones" },
            { id: "maquinas", icon: Icons.cog, label: "Máquinas" },
            { id: "resumen", icon: Icons.chart, label: "Conciliación" },
          ].map(item => (
            <button key={item.id} style={S.navItem(tab === item.id)} onClick={() => setTab(item.id)}>
              {item.icon}
              <span>{item.label}</span>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

            <label style={S.label}>Fecha</label>
            <div style={{ ...S.input, background: colors.surface3, color: colors.textDim, marginBottom: 0 }}>
              {new Date().toLocaleDateString("es-CO")}
            </div>
          </div>
          <div style={S.col}>
            <label style={S.label}>Hora</label>
            <div style={{ ...S.input, background: colors.surface3, color: colors.textDim, marginBottom: 0 }}>
              {new Date().toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" })}
            </div>
          </div>
        </div>

        <button
          style={{ ...S.btnPrimary, opacity: sede && tesorero ? 1 : 0.4 }}

      <div style={{ ...S.card, background: colors.accentDim, borderColor: "rgba(245,158,11,0.2)" }}>

          <strong>💡 Tip:</strong> Este prototipo funciona 100% local. En producción, 
          los datos se guardan automáticamente en Google Sheets en tiempo real.
        </div>
      </div>
    </div>
  );
}

  return (
    <div>
      <div style={{ ...S.row, marginBottom: 16, gap: 8 }}>
        <div style={S.summaryCard(colors.accent)}>
          <div style={S.summaryLabel}>Liquidaciones</div>
          <div style={S.summaryValue(colors.accent)}>{items.length}</div>
        </div>
        <div style={S.summaryCard(colors.green)}>
          <div style={S.summaryLabel}>Total Efectivo</div>
          <div style={{ ...S.summaryValue(colors.green), fontSize: 16 }}>{fmt(total)}</div>
        </div>
      </div>

      {items.length === 0 && (
        <div style={S.emptyState}>
          <div style={{ fontSize: 48, marginBottom: 12 }}>📝</div>
          <div style={{ fontSize: 15, fontWeight: 600, color: colors.textBright, marginBottom: 6 }}>Sin liquidaciones</div>
          <div style={{ fontSize: 13 }}>Registra la primera liquidación del ciclo</div>
        </div>
      )}

      {items.map((l, i) => (
        <div key={l.id} style={S.listItem} onClick={() => onEdit(l)}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
            <div>
              <div style={{ fontSize: 14, fontWeight: 700, color: colors.textBright }}>
                Liquidación {i + 1}
              </div>
              <div style={{ fontSize: 12, color: colors.textDim, marginTop: 2 }}>
                {l.operador || "Sin operador"} · Recibo #{l.numRecibo || "—"} · {fmtNum(l.tokensVendidos)} tokens
              </div>
            </div>
            <div style={{ textAlign: "right" }}>
              <div style={{ fontSize: 15, fontWeight: 700, color: colors.green }}>{fmt(l.efectivo)}</div>
              {l.descuadre !== undefined && l.descuadre !== 0 && (
                <span style={S.badge(colors.red, colors.redDim)}>
                  Δ {fmt(l.descuadre)}
                </span>
              )}
            </div>
          </div>
          <div style={{ display: "flex", justifyContent: "flex-end", marginTop: 8 }}>
            <button style={{ ...S.btnDanger, padding: "6px 10px", fontSize: 11 }}
              onClick={(e) => { e.stopPropagation(); onDelete(l.id); }}>
              {Icons.trash} Eliminar
            </button>
          </div>
        </div>
      ))}

      <button style={{ ...S.btnPrimary, marginTop: 8 }} onClick={onAdd}>
        {Icons.plus} Agregar Liquidación
      </button>
    </div>
  );
}

// ============================================================
// LIQUIDACION FORM
// ============================================================
function LiquidacionForm({ initial, index, sede, onSave }) {
  const [f, setF] = useState({
    operador: "", numRecibo: "", tokensBase: "", tokensVendidos: "",
    valor: "", qr: "", devoluciones: "", devTokens: "", observaciones: "",
    efectivoContado: "",
    ...initial,
  });

  const upd = (key, val) => setF(prev => ({ ...prev, [key]: val }));
  const operadoresSede = getOperadores(sede);

  const efectivoEsperado = (Number(f.valor) || 0) - (Number(f.qr) || 0) - (Number(f.devoluciones) || 0);
  const tokensRestantes = (Number(f.tokensBase) || 0) - (Number(f.tokensVendidos) || 0) - (Number(f.devTokens) || 0);
  const descuadre = f.efectivoContado ? (Number(f.efectivoContado) || 0) - efectivoEsperado : 0;

  const handleSave = () => {
    onSave({
      ...f,
      id: f.id || null,
      efectivo: efectivoEsperado,
      descuadre: descuadre,
      tokensRestantes,
    });
  };

  return (
    <div>
      <div style={S.card}>
        <div style={S.cardTitle}>👤 Información del Turno</div>
        <label style={S.label}>Operador</label>
        <select style={S.select} value={f.operador} onChange={e => upd("operador", e.target.value)}>
          <option value="">Seleccionar operador...</option>
          {operadoresSede.map(op => <option key={op} value={op}>{op}</option>)}
        </select>

        <div style={S.row}>
          <div style={S.col}>
            <label style={S.label}>Nº Recibo</label>
            <input style={S.input} placeholder="#89-0092" value={f.numRecibo} onChange={e => upd("numRecibo", e.target.value)} />
          </div>
          <div style={S.col}>
            <label style={S.label}>Liquidación #</label>
            <div style={{ ...S.input, background: colors.surface3, color: colors.accent, fontWeight: 700 }}>{index}</div>
          </div>
        </div>
      </div>

      <div style={S.card}>
        <div style={S.cardTitle}>🪙 Tokens</div>
        <div style={S.row}>
          <div style={S.col}>
            <label style={S.label}>Base (inicio)</label>
            <input style={S.input} type="number" inputMode="numeric" placeholder="0" value={f.tokensBase} onChange={e => upd("tokensBase", e.target.value)} />
          </div>
          <div style={S.col}>
            <label style={S.label}>Vendidos</label>
            <input style={S.input} type="number" inputMode="numeric" placeholder="0" value={f.tokensVendidos} onChange={e => upd("tokensVendidos", e.target.value)} />
          </div>
          <div style={S.col}>
            <label style={S.label}>Dev. Tokens</label>
            <input style={S.input} type="number" inputMode="numeric" placeholder="0" value={f.devTokens} onChange={e => upd("devTokens", e.target.value)} />
          </div>
        </div>
        <div style={{ ...S.alertBox("info"), margin: 0 }}>
          🪙 Tokens restantes: <strong style={{ marginLeft: 4 }}>{tokensRestantes}</strong>
        </div>
      </div>

      <div style={S.card}>
        <div style={S.cardTitle}>💵 Valores</div>
        <label style={S.label}>Valor Total (Productos + Tokens)</label>
        <input style={S.input} type="number" inputMode="numeric" placeholder="$0" value={f.valor} onChange={e => upd("valor", e.target.value)} />

        <div style={S.row}>
          <div style={S.col}>
            <label style={S.label}>Valor QR</label>
            <input style={S.input} type="number" inputMode="numeric" placeholder="$0" value={f.qr} onChange={e => upd("qr", e.target.value)} />
          </div>
          <div style={S.col}>
            <label style={S.label}>Devoluciones $</label>
            <input style={S.input} type="number" inputMode="numeric" placeholder="$0" value={f.devoluciones} onChange={e => upd("devoluciones", e.target.value)} />
          </div>
        </div>

        <div style={S.divider} />

        <div style={S.resultRow}>
          <span style={S.resultLabel}>Efectivo esperado</span>
          <span style={{ ...S.resultValue, color: colors.green }}>{fmt(efectivoEsperado)}</span>
        </div>
      </div>

      <div style={S.card}>
        <div style={S.cardTitle}>✅ Verificación de Efectivo</div>
        <label style={S.label}>Efectivo contado físicamente</label>
        <input
          style={{ ...S.input, borderColor: descuadre !== 0 && f.efectivoContado ? colors.red : f.efectivoContado ? colors.green : colors.border, borderWidth: 2 }}
          type="number" inputMode="numeric" placeholder="Ingresa el monto contado"
          value={f.efectivoContado} onChange={e => upd("efectivoContado", e.target.value)}
        />

        {f.efectivoContado && descuadre === 0 && (
          <div style={S.alertBox("success")}>
            {Icons.check} ¡Cuadra perfecto! El efectivo coincide.
          </div>
        )}

        {f.efectivoContado && descuadre !== 0 && (
          <div style={S.alertBox("error")}>
            {Icons.alert} Descuadre de {fmt(Math.abs(descuadre))} ({descuadre > 0 ? "sobrante" : "faltante"})
          </div>
        )}
      </div>

      <div style={S.card}>
        <label style={S.label}>Observaciones</label>
        <textarea
          style={{ ...S.input, minHeight: 70, resize: "vertical" }}
          placeholder="Notas adicionales..."
          value={f.observaciones}
          onChange={e => upd("observaciones", e.target.value)}
        />
      </div>

      <button style={S.btnPrimary} onClick={handleSave}>
        {Icons.save} Guardar Liquidación
      </button>
    </div>
  );
}

// MAQUINAS LIST (con conteo físico global)

function MaquinasList({ items, conteoFisico, totales, onAdd, onEdit, onDelete, onConteoFisico }) {
  const totalProd = items.reduce((s, m) => s + (Number(m.producido) || 0), 0);
  const totalTokenDia = items.reduce((s, m) => s + (Number(m.tokenDia) || 0), 0);
  const totalMoneDia = items.reduce((s, m) => s + (Number(m.moneDia) || 0), 0);
  const tieneConteoFisico = conteoFisico.tokensFisicos !== "" || conteoFisico.efectivoTotal !== "";

  return (
    <div>
      {/* Summary cards */}
      <div style={{ display: "flex", gap: 8, marginBottom: 16, flexWrap: "wrap" }}>
        <div style={S.summaryCard()}>
          <div style={S.summaryLabel}>Máquinas</div>
          <div style={S.summaryValue(colors.blue)}>{items.length}</div>
        </div>
        <div style={S.summaryCard()}>
          <div style={S.summaryLabel}>Producido</div>
          <div style={{ ...S.summaryValue(colors.green), fontSize: 14 }}>{fmt(totalProd)}</div>
        </div>
        <div style={S.summaryCard()}>
          <div style={S.summaryLabel}>Σ TOKEN_DIA</div>
          <div style={S.summaryValue(colors.accent)}>{fmtNum(totalTokenDia)}</div>
        </div>
      </div>

      {/* Machine list */}
      {items.length === 0 && (
        <div style={S.emptyState}>
          <div style={{ fontSize: 48, marginBottom: 12 }}>🔧</div>
          <div style={{ fontSize: 15, fontWeight: 600, color: colors.textBright, marginBottom: 6 }}>Sin conteos</div>
          <div style={{ fontSize: 13 }}>Registra los contadores de cada máquina</div>
        </div>
      )}

      {items.map((m) => (
        <div key={m.id} style={S.listItem} onClick={() => onEdit(m)}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
            <div>
              <div style={{ fontSize: 14, fontWeight: 700, color: colors.textBright }}>{m.nombre}</div>
              <div style={{ fontSize: 12, color: colors.textDim, marginTop: 2 }}>
                TOKEN_DIA: {fmtNum(m.tokenDia)} · MONE_DIA: {fmt(m.moneDia)}
              </div>
            </div>
            <div style={{ textAlign: "right" }}>
              <div style={{ fontSize: 15, fontWeight: 700, color: colors.green }}>{fmt(m.producido)}</div>
            </div>
          </div>
          <div style={{ display: "flex", justifyContent: "flex-end", marginTop: 8 }}>
            <button style={{ ...S.btnDanger, padding: "6px 10px", fontSize: 11 }}
              onClick={(e) => { e.stopPropagation(); onDelete(m.id); }}>
              {Icons.trash} Eliminar
            </button>
          </div>
        </div>
      ))}

      <button style={{ ...S.btnPrimary, marginTop: 8 }} onClick={onAdd}>
        {Icons.plus} Agregar Conteo de Máquina
      </button>

      {/* Conteo Físico Global */}
      {items.length > 0 && (
        <>
          <div style={{ height: 1, background: colors.border, margin: "20px 0" }} />

          <div style={{
            background: tieneConteoFisico ? "rgba(16,185,129,0.06)" : "rgba(245,158,11,0.06)",
            border: `1px solid ${tieneConteoFisico ? "rgba(16,185,129,0.25)" : "rgba(245,158,11,0.25)"}`,
            borderRadius: 14,
            padding: 20,
          }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 12 }}>
              <div>
                <div style={{ fontSize: 15, fontWeight: 700, color: colors.textBright, display: "flex", alignItems: "center", gap: 8 }}>
                  🔍 Conteo Físico General
                  {tieneConteoFisico ? (
                    <span style={S.badge(colors.green, colors.greenDim)}>✓ Registrado</span>
                  ) : (
                    <span style={S.badge(colors.accent, colors.accentDim)}>Pendiente</span>
                  )}
                </div>
                <div style={{ fontSize: 12, color: colors.textDim, marginTop: 4, lineHeight: 1.5 }}>
                  Conteo total de tokens y monedas después de vaciar todas las máquinas
                </div>
              </div>
            </div>

            {tieneConteoFisico && (
              <div style={{ marginBottom: 12 }}>
                <div style={S.resultRow}>
                  <span style={S.resultLabel}>Tokens físicos contados</span>
                  <span style={S.resultValue}>{fmtNum(conteoFisico.tokensFisicos)}</span>
                </div>
                <div style={{ ...S.resultRow, borderBottom: "none" }}>
                  <span style={S.resultLabel}>Efectivo total contado</span>
                  <span style={{ ...S.resultValue, color: colors.green }}>{fmt(conteoFisico.efectivoTotal)}</span>
                </div>

                {/* Comparación automática */}
                <div style={{ marginTop: 10 }}>
                  {totales.difTokensGlobal === 0 ? (
                    <div style={S.alertBox("success")}>{Icons.check} Tokens cuadran (Σ TOKEN_DIA = Físico)</div>
                  ) : (
                    <div style={S.alertBox("error")}>{Icons.alert} Diferencia de {Math.abs(totales.difTokensGlobal)} tokens · Σ TOKEN_DIA: {fmtNum(totales.sumaTokenDiaMaq)} vs Físico: {fmtNum(conteoFisico.tokensFisicos)}</div>
                  )}
                  {totales.difDineroGlobal === 0 ? (
                    <div style={S.alertBox("success")}>{Icons.check} Efectivo cuadra (Σ MONE_DIA = Conteo)</div>
                  ) : (
                    <div style={S.alertBox("error")}>{Icons.alert} Diferencia de {fmt(Math.abs(totales.difDineroGlobal))} · Σ MONE_DIA: {fmt(totales.sumaMoneDiaMaq)} vs Conteo: {fmt(conteoFisico.efectivoTotal)}</div>
                  )}
                </div>
              </div>
            )}

            <button
              style={tieneConteoFisico ? S.btnSecondary : { ...S.btnPrimary, background: `linear-gradient(135deg, ${colors.blue}, #2563eb)`, color: "#fff" }}
              onClick={onConteoFisico}
            >
              🔍 {tieneConteoFisico ? "Editar Conteo Físico" : "Registrar Conteo Físico"}
            </button>
          </div>
        </>
      )}
    </div>
  );
}

// ============================================================
// MAQUINA FORM (con auto-carga de datos del ciclo anterior)
// ============================================================
function MaquinaForm({ initial, sede, maquinasYaRegistradas, onSave }) {
  const [f, setF] = useState({
    nombre: "", genAnterior: "", genActual: "", genTokenAnterior: "", genTokenActual: "",
    tokenDia: "", moneDia: "",
    historialCargado: false, cicloAnteriorFecha: "",
    ...initial,
  });

  const upd = (key, val) => setF(prev => ({ ...prev, [key]: val }));

  // Auto-cargar datos del ciclo anterior cuando se selecciona una máquina
  const handleSelectMaquina = (nombre) => {
    const historial = HISTORIAL_MAQUINAS[sede]?.[nombre];
    if (historial && !initial?.id) {
      setF(prev => ({
        ...prev,
        nombre,
        genAnterior: historial.gen,
        genTokenAnterior: historial.genToken,
        historialCargado: true,
        cicloAnteriorFecha: historial.cicloFecha,
      }));
    } else {
      upd("nombre", nombre);
    }
  };

  const producido = (Number(f.genActual) || 0) - (Number(f.genAnterior) || 0);
  const producidoTokens = (Number(f.genTokenActual) || 0) - (Number(f.genTokenAnterior) || 0);

  // Filtrar máquinas ya registradas (excepto la que se está editando)
  const maquinasDisponibles = getMaquinas(sede).filter(
    m => !maquinasYaRegistradas?.includes(m) || m === initial?.nombre
  );

  const handleSave = () => {
    onSave({ ...f, id: f.id || null, producido, producidoTokens });
  };

  const readOnlyStyle = {
    ...S.input,
    background: "rgba(16,185,129,0.08)",
    borderColor: "rgba(16,185,129,0.25)",
    color: colors.green,
    fontWeight: 700,
    cursor: "default",
  };

  return (
    <div>
      <div style={S.card}>
        <div style={S.cardTitle}>🔧 Máquina</div>
        <label style={S.label}>Nombre / Identificación</label>
        <select style={S.select} value={f.nombre} onChange={e => handleSelectMaquina(e.target.value)}>
          <option value="">Seleccionar máquina...</option>
          {maquinasDisponibles.map(m => <option key={m} value={m}>{m}</option>)}
        </select>

        {f.historialCargado && (
          <div style={{
            background: "rgba(16,185,129,0.08)",
            border: "1px solid rgba(16,185,129,0.2)",
            borderRadius: 10,
            padding: "10px 14px",
            display: "flex",
            alignItems: "center",
            gap: 8,
            marginTop: 2,
          }}>
            <span style={{ fontSize: 16 }}>✅</span>
            <div>
              <div style={{ fontSize: 12, fontWeight: 700, color: colors.green }}>
                Datos del ciclo anterior cargados automáticamente
              </div>
              <div style={{ fontSize: 11, color: colors.textDim, marginTop: 2 }}>
                Último conteo: {f.cicloAnteriorFecha} · Sede: {sede}
              </div>
            </div>
          </div>
        )}

        {f.nombre && !f.historialCargado && !initial?.id && (
          <div style={{
            background: "rgba(245,158,11,0.08)",
            border: "1px solid rgba(245,158,11,0.2)",
            borderRadius: 10,
            padding: "10px 14px",
            display: "flex",
            alignItems: "center",
            gap: 8,
            marginTop: 2,
          }}>
            <span style={{ fontSize: 16 }}>⚠️</span>
            <div style={{ fontSize: 12, color: colors.accent }}>
              Sin historial previo para esta máquina. Ingresa los contadores anteriores manualmente.
            </div>
          </div>
        )}
      </div>

      <div style={S.card}>
        <div style={{ ...S.cardTitle, justifyContent: "space-between" }}>
          <span>📊 Contadores Generales (acumulados)</span>
        </div>

        {/* GEN - Dinero acumulado */}
        <div style={S.row}>
          <div style={S.col}>
            <label style={{ ...S.label, display: "flex", alignItems: "center", gap: 6 }}>
              GEN anterior $
              {f.historialCargado && (
                <span style={{
                  fontSize: 9, background: colors.greenDim, color: colors.green,
                  padding: "2px 6px", borderRadius: 8, fontWeight: 700,
                }}>AUTO</span>
              )}
            </label>
            {f.historialCargado ? (
              <div style={readOnlyStyle}>{fmt(f.genAnterior)}</div>
            ) : (
              <input style={S.input} type="number" inputMode="numeric" placeholder="0"
                value={f.genAnterior} onChange={e => upd("genAnterior", e.target.value)} />
            )}
          </div>
          <div style={S.col}>
            <label style={S.label}>GEN actual $ <span style={{ color: colors.accent, fontSize: 9 }}>⬅ INGRESAR</span></label>
            <input style={{ ...S.input, borderColor: colors.accent, borderWidth: 2 }}
              type="number" inputMode="numeric" placeholder="Leer de la máquina"
              value={f.genActual} onChange={e => upd("genActual", e.target.value)} />
          </div>
        </div>

        {producido > 0 && (
          <div style={{ ...S.resultRow, borderBottom: "none", background: colors.greenDim, borderRadius: 8, padding: "10px 14px", marginTop: 4 }}>
            <span style={{ ...S.resultLabel, color: colors.green }}>💰 Producido este ciclo</span>
            <span style={{ ...S.resultValue, color: colors.green }}>{fmt(producido)}</span>
          </div>
        )}

        <div style={S.divider} />

        {/* GEN_TOKEN - Tokens acumulados */}
        <div style={S.row}>
          <div style={S.col}>
            <label style={{ ...S.label, display: "flex", alignItems: "center", gap: 6 }}>
              GEN_TOKEN anterior
              {f.historialCargado && (
                <span style={{
                  fontSize: 9, background: colors.greenDim, color: colors.green,
                  padding: "2px 6px", borderRadius: 8, fontWeight: 700,
                }}>AUTO</span>
              )}
            </label>
            {f.historialCargado ? (
              <div style={readOnlyStyle}>{fmtNum(f.genTokenAnterior)}</div>
            ) : (
              <input style={S.input} type="number" inputMode="numeric" placeholder="0"
                value={f.genTokenAnterior} onChange={e => upd("genTokenAnterior", e.target.value)} />
            )}
          </div>
          <div style={S.col}>
            <label style={S.label}>GEN_TOKEN actual <span style={{ color: colors.accent, fontSize: 9 }}>⬅ INGRESAR</span></label>
            <input style={{ ...S.input, borderColor: colors.accent, borderWidth: 2 }}
              type="number" inputMode="numeric" placeholder="Leer de la máquina"
              value={f.genTokenActual} onChange={e => upd("genTokenActual", e.target.value)} />
          </div>
        </div>

        {producidoTokens > 0 && (
          <div style={{ ...S.resultRow, borderBottom: "none", background: colors.accentDim, borderRadius: 8, padding: "10px 14px", marginTop: 4 }}>
            <span style={{ ...S.resultLabel, color: colors.accent }}>🪙 Tokens producidos</span>
            <span style={{ ...S.resultValue, color: colors.accent }}>{fmtNum(producidoTokens)}</span>
          </div>
        )}
      </div>

      <div style={S.card}>
        <div style={S.cardTitle}>🔄 Contadores de Ciclo (reiniciables)</div>
        <div style={{ fontSize: 12, color: colors.textDim, marginBottom: 12, lineHeight: 1.5 }}>
          Estos valores se leen directamente de la pantalla de la máquina (TOKEN_DIA y MONE_DIA).
        </div>
        <div style={S.row}>
          <div style={S.col}>
            <label style={S.label}>TOKEN_DIA</label>
            <input style={S.input} type="number" inputMode="numeric" placeholder="0" value={f.tokenDia} onChange={e => upd("tokenDia", e.target.value)} />
          </div>
          <div style={S.col}>
            <label style={S.label}>MONE_DIA $</label>
            <input style={S.input} type="number" inputMode="numeric" placeholder="0" value={f.moneDia} onChange={e => upd("moneDia", e.target.value)} />
          </div>
        </div>
      </div>

      <button style={{ ...S.btnPrimary, opacity: f.nombre && f.genActual ? 1 : 0.4 }}
        disabled={!f.nombre || !f.genActual}
        onClick={handleSave}>
        {Icons.save} Guardar Conteo
      </button>
    </div>
  );
}

// ============================================================
// CONTEO FÍSICO GLOBAL (tokens + monedas de TODAS las máquinas mezcladas)
// ============================================================
function ConteoFisicoGlobal({ maquinas, conteoFisico, totales, onSave }) {
  const [f, setF] = useState({
    tokensFisicos: conteoFisico.tokensFisicos || "",
    efectivoTotal: conteoFisico.efectivoTotal || "",
  });

  const upd = (key, val) => setF(prev => ({ ...prev, [key]: val }));

  const efectivoTotal = Number(f.efectivoTotal) || 0;
  const tokensFisicos = Number(f.tokensFisicos) || 0;
  const difTokens = totales.sumaTokenDiaMaq - tokensFisicos;
  const difDinero = totales.sumaMoneDiaMaq - efectivoTotal;

  return (
    <div>
      {/* Resumen de contadores por máquina */}
      <div style={S.card}>
        <div style={S.cardTitle}>📊 Resumen Contadores (Σ de todas las máquinas)</div>
        <div style={{ fontSize: 12, color: colors.textDim, marginBottom: 14, lineHeight: 1.5 }}>
          Estos son los totales que deben coincidir con el conteo físico de abajo.
        </div>

        {maquinas.map(m => (
          <div key={m.id} style={{ display: "flex", justifyContent: "space-between", padding: "8px 0", borderBottom: `1px solid ${colors.border}`, fontSize: 13 }}>
            <span style={{ color: colors.textDim }}>{m.nombre}</span>
            <div style={{ display: "flex", gap: 16 }}>
              <span style={{ color: colors.accent }}>{fmtNum(m.tokenDia)} tok</span>
              <span style={{ color: colors.green, minWidth: 90, textAlign: "right" }}>{fmt(m.moneDia)}</span>
            </div>
          </div>
        ))}

        <div style={{ display: "flex", justifyContent: "space-between", padding: "12px 0 4px", fontSize: 14, fontWeight: 700 }}>
          <span style={{ color: colors.textBright }}>TOTAL ESPERADO</span>
          <div style={{ display: "flex", gap: 16 }}>
            <span style={{ color: colors.accent }}>{fmtNum(totales.sumaTokenDiaMaq)} tok</span>
            <span style={{ color: colors.green, minWidth: 90, textAlign: "right" }}>{fmt(totales.sumaMoneDiaMaq)}</span>
          </div>
        </div>
      </div>

      {/* Conteo físico real */}
      <div style={S.card}>
        <div style={S.cardTitle}>🔍 Conteo Físico Real</div>
        <div style={{ fontSize: 12, color: colors.textDim, marginBottom: 14, lineHeight: 1.5 }}>
          Ingresa el conteo total después de vaciar y mezclar el contenido de todas las máquinas.
        </div>

        <label style={S.label}>Total tokens físicos contados</label>
        <input
          style={{ ...S.input, borderColor: colors.accent, borderWidth: 2, fontSize: 18, fontWeight: 700, textAlign: "center", padding: "16px 14px" }}
          type="number" inputMode="numeric"
          placeholder="Contar todos los tokens"
          value={f.tokensFisicos}
          onChange={e => upd("tokensFisicos", e.target.value)}
        />

        <div style={S.divider} />

        <label style={S.label}>Efectivo total contado (monedas)</label>
        <input
          style={{ ...S.input, borderColor: colors.green, borderWidth: 2, fontSize: 18, fontWeight: 700, textAlign: "center", padding: "16px 14px" }}
          type="number" inputMode="numeric"
          placeholder="Total en efectivo de las monedas"
          value={f.efectivoTotal}
          onChange={e => upd("efectivoTotal", e.target.value)}
        />
      </div>

      {/* Comparación automática */}
      {(f.tokensFisicos || f.efectivoTotal) && (
        <div style={S.card}>
          <div style={S.cardTitle}>⚖️ Comparación Automática</div>

          <div style={{ ...S.resultRow }}>
            <span style={S.resultLabel}>Σ TOKEN_DIA (contadores)</span>
            <span style={S.resultValue}>{fmtNum(totales.sumaTokenDiaMaq)}</span>
          </div>
          <div style={{ ...S.resultRow }}>
            <span style={S.resultLabel}>Tokens físicos contados</span>
            <span style={S.resultValue}>{fmtNum(tokensFisicos)}</span>
          </div>
          <div style={{ marginTop: 8, marginBottom: 12 }}>
            {difTokens === 0 ? (
              <div style={S.alertBox("success")}>{Icons.check} Tokens cuadran perfectamente</div>
            ) : (
              <div style={S.alertBox("error")}>
                {Icons.alert} Diferencia de {Math.abs(difTokens)} tokens ({difTokens > 0 ? "faltan físicos" : "sobran físicos"})
              </div>
            )}
          </div>

          <div style={S.divider} />

          <div style={{ ...S.resultRow }}>
            <span style={S.resultLabel}>Σ MONE_DIA (contadores)</span>
            <span style={S.resultValue}>{fmt(totales.sumaMoneDiaMaq)}</span>
          </div>
          <div style={{ ...S.resultRow }}>
            <span style={S.resultLabel}>Efectivo contado</span>
            <span style={S.resultValue}>{fmt(efectivoTotal)}</span>
          </div>
          <div style={{ marginTop: 8 }}>
            {difDinero === 0 ? (
              <div style={S.alertBox("success")}>{Icons.check} Efectivo cuadra perfectamente</div>
            ) : (
              <div style={S.alertBox("error")}>
                {Icons.alert} Diferencia de {fmt(Math.abs(difDinero))} ({difDinero > 0 ? "falta dinero" : "sobra dinero"})
              </div>
            )}
          </div>
        </div>
      )}

      <button style={S.btnPrimary} onClick={() => onSave(f)}>
        {Icons.save} Guardar Conteo Físico
      </button>
    </div>
  );
}

// ============================================================
// REPARTO TOKENS + BASE EFECTIVO
// ============================================================
function RepartoTokens({ liquidaciones, tokensMaq, sede, gastos, historialTokens, onSave }) {
  const operadores = [...new Set(liquidaciones.map(l => l.operador).filter(Boolean))];
  const [reparto, setReparto] = useState(operadores.map(op => ({ nombre: op, tokens: "" })));
  const [modoReparto, setModoReparto] = useState("operadores"); // "operadores" o "sede"
  const [ajusteTokens, setAjusteTokens] = useState(""); // + ingresos, - retiros
  const [ajusteMotivo, setAjusteMotivo] = useState("");

  // Base de efectivo
  const baseConfigurada = getBase(sede);
  const [baseRecogida, setBaseRecogida] = useState("");
  const [baseNueva, setBaseNueva] = useState(String(baseConfigurada));

  const totalGastos = gastos.reduce((s, g) => s + (Number(g.monto) || 0), 0);

  // Tokens
  const tokensRestantesOps = liquidaciones.reduce((s, l) => s + (Number(l.tokensRestantes) || 0), 0);
  const totalTokensRepartido = reparto.reduce((s, r) => s + (Number(r.tokens) || 0), 0);

  // Trazabilidad por operador: usar prop historialTokens O la variable global como fallback
  const historialSede = historialTokens || HISTORIAL_TOKENS_OPERADOR[sede] || {};
  const baseSede = historialSede['BASE_SEDE'] || null; // Si existe, el ciclo anterior fue modo "sede"
  
  // DEBUG: Ver qué datos llegan
  console.log('=== DEBUG HISTORIAL TOKENS ===');
  console.log('sede:', sede);
  console.log('historialTokens (prop):', JSON.stringify(historialTokens));
  console.log('GLOBAL[sede]:', JSON.stringify(HISTORIAL_TOKENS_OPERADOR[sede]));
  console.log('historialSede final:', JSON.stringify(historialSede));
  console.log('baseSede:', JSON.stringify(baseSede));
  console.log('operadores:', operadores);
  console.log('=== FIN DEBUG ===');
  
  const operadorData = operadores.map(nombre => {
    const normalizado = nombre.charAt(0).toUpperCase() + nombre.slice(1).toLowerCase();
    const historial = historialSede[normalizado] || historialSede[nombre] || null;
    const liqsDeEsteOp = liquidaciones.filter(l => l.operador === nombre);
    const vendidosEsteC = liqsDeEsteOp.reduce((s, l) => s + (Number(l.tokensVendidos) || 0), 0);
    const devTokensEsteC = liqsDeEsteOp.reduce((s, l) => s + (Number(l.devTokens) || 0), 0);
    
    let saldoEsperado;
    if (baseSede) {
      // Ciclo anterior fue modo "sede": la base era compartida
      // No hay saldo individual, solo se sabe cuánto vendió cada uno
      // El saldo individual no aplica, se calcula contra la base total
      saldoEsperado = null; // Se manejará a nivel sede
    } else if (historial) {
      saldoEsperado = historial.saldo - vendidosEsteC - devTokensEsteC;
    } else {
      saldoEsperado = null;
    }
    return { nombre, historial, vendidosEsteC, devTokensEsteC, saldoEsperado };
  });

  // Calcular saldo esperado total
  let totalSaldoAnterior, totalSaldoEsperado;
  if (baseSede) {
    // Modo sede anterior: la base total menos lo vendido por todos
    totalSaldoAnterior = baseSede.saldo || 0;
    const totalVendido = operadorData.reduce((s, o) => s + o.vendidosEsteC, 0);
    const totalDev = operadorData.reduce((s, o) => s + o.devTokensEsteC, 0);
    totalSaldoEsperado = Math.max(totalSaldoAnterior - totalVendido - totalDev, 0);
  } else {
    totalSaldoAnterior = operadorData.reduce((s, o) => s + (o.historial?.saldo || 0), 0);
    totalSaldoEsperado = operadorData.reduce((s, o) => s + Math.max(o.saldoEsperado || 0, 0), 0);
  }
  const totalVendidosCiclo = operadorData.reduce((s, o) => s + o.vendidosEsteC, 0);
  const totalDevTokensCiclo = operadorData.reduce((s, o) => s + o.devTokensEsteC, 0);
  const ajusteNum = Number(ajusteTokens) || 0;
  const totalTokensDisponible = tokensMaq + totalSaldoEsperado + ajusteNum;
  const tokensRestante = totalTokensDisponible - totalTokensRepartido;

  // Detección de pérdida: tokens que deberían existir pero no están
  const tokensPerdidos = Math.max(0, totalSaldoAnterior - totalVendidosCiclo - totalDevTokensCiclo - tokensMaq - totalSaldoEsperado);

  // Base: diferencia entre lo recogido y los gastos
  const baseRecogidaNum = Number(baseRecogida) || 0;
  const baseNuevaNum = Number(baseNueva) || 0;
  const baseEsperada = baseConfigurada - totalGastos;
  const difBase = baseRecogidaNum - baseEsperada;

  const handleSave = () => {
    onSave({
      modoReparto,
      operadores: modoReparto === "operadores" ? reparto : [],
      tokensTotalBase: totalTokensDisponible,
      ajusteTokens: ajusteNum,
      ajusteMotivo: ajusteMotivo,
      baseRecogida: baseRecogidaNum,
      baseNueva: baseNuevaNum,
      baseConfigurada,
      totalGastosDeSede: totalGastos,
      controlTokens: operadorData,
      tokensMaq,
      totalSaldoAnterior,
      totalVendidosCiclo,
      totalDevTokensCiclo,
      tokensPerdidos,
    });
  };

  return (
    <div>
      {/* ===== SECCIÓN 1: BASE DE EFECTIVO ===== */}
      <div style={S.card}>
        <div style={S.cardTitle}>💵 Base de Efectivo — {sede}</div>
        <div style={{ fontSize: 12, color: colors.textDim, marginBottom: 14, lineHeight: 1.6 }}>
          Se recoge la base anterior completa y se deja una nueva. La base sirve para gastos de sede y para menudear billetes por monedas.
        </div>

        {/* Base configurada */}
        <div style={{
          background: colors.surface2, borderRadius: 10, padding: "12px 16px",
          display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14,
          border: `1px solid ${colors.border}`,
        }}>
          <div>
            <div style={{ fontSize: 11, color: colors.textDim, fontWeight: 600, letterSpacing: 0.5, textTransform: "uppercase" }}>Base configurada para esta sede</div>
            <div style={{ fontSize: 20, fontWeight: 800, color: colors.accent, marginTop: 2 }}>{fmt(baseConfigurada)}</div>
          </div>
          <span style={{
            fontSize: 9, background: colors.accentDim, color: colors.accent,
            padding: "3px 8px", borderRadius: 8, fontWeight: 700,
          }}>CONFIGURADO</span>
        </div>

        {/* Base recogida */}
        <label style={S.label}>💰 Efectivo recogido de la base anterior</label>
        <input
          style={{ ...S.input, borderColor: colors.accent, borderWidth: 2, fontSize: 16, fontWeight: 700, textAlign: "center" }}
          type="number" inputMode="numeric"
          placeholder="¿Cuánto queda de la base anterior?"
          value={baseRecogida}
          onChange={e => setBaseRecogida(e.target.value)}
        />

        {baseRecogida !== "" && (
          <div style={{ marginBottom: 8 }}>
            <div style={S.resultRow}>
              <span style={S.resultLabel}>Base original</span>
              <span style={S.resultValue}>{fmt(baseConfigurada)}</span>
            </div>
            <div style={S.resultRow}>
              <span style={{ ...S.resultLabel, color: colors.red }}>− Gastos registrados</span>
              <span style={{ ...S.resultValue, color: colors.red }}>{fmt(totalGastos)}</span>
            </div>
            <div style={S.resultRow}>
              <span style={S.resultLabel}>Base esperada</span>
              <span style={{ ...S.resultValue, color: colors.accent }}>{fmt(baseEsperada)}</span>
            </div>
            <div style={{ ...S.resultRow, borderBottom: "none" }}>
              <span style={S.resultLabel}>Efectivo recogido</span>
              <span style={S.resultValue}>{fmt(baseRecogidaNum)}</span>
            </div>

            {difBase === 0 ? (
              <div style={S.alertBox("success")}>{Icons.check} La base cuadra con los gastos registrados</div>
            ) : (
              <div style={S.alertBox(difBase > 0 ? "info" : "error")}>
                {difBase > 0 ? Icons.check : Icons.alert} {Math.abs(difBase) > 0 && `Diferencia de ${fmt(Math.abs(difBase))}`} ({difBase > 0 ? "sobra — posible menudeo no devuelto" : "falta — revisar gastos no registrados"})
              </div>
            )}
          </div>
        )}

        <div style={S.divider} />

        {/* Base nueva */}
        <label style={S.label}>📤 Base nueva que se deja en sede</label>
        <input
          style={{ ...S.input, borderColor: colors.green, borderWidth: 2, fontSize: 16, fontWeight: 700, textAlign: "center" }}
          type="number" inputMode="numeric"
          placeholder={String(baseConfigurada)}
          value={baseNueva}
          onChange={e => setBaseNueva(e.target.value)}
        />

        {baseNuevaNum !== baseConfigurada && baseNueva !== "" && (
          <div style={S.alertBox("info")}>
            ⚠️ La base nueva ({fmt(baseNuevaNum)}) es diferente a la configurada ({fmt(baseConfigurada)})
          </div>
        )}

        {baseNuevaNum === baseConfigurada && baseNueva !== "" && (
          <div style={S.alertBox("success")}>{Icons.check} Base nueva completa</div>
        )}
      </div>

      {/* ===== SECCIÓN 2: TRAZABILIDAD TOKENS DEL CICLO ===== */}
      <div style={{
        background: "rgba(239,68,68,0.04)",
        border: "1px solid rgba(239,68,68,0.15)",
        borderRadius: 14, padding: 20, marginBottom: 14,
      }}>
        <div style={{ ...S.cardTitle, color: colors.red }}>🔒 Control de Tokens — Zona Crítica</div>
        <div style={{ fontSize: 12, color: colors.textDim, lineHeight: 1.6, marginBottom: 14 }}>
          Aquí se cruza la información del ciclo anterior con las liquidaciones actuales para detectar tokens faltantes. Cada token perdido es dinero perdido.
        </div>

        {/* Si el ciclo anterior fue modo sede, mostrar resumen global primero */}
        {baseSede && (
          <div style={{
            background: colors.surface,
            border: `1px solid ${colors.blue}30`,
            borderRadius: 12, padding: 16, marginBottom: 14,
          }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
              <div style={{ fontSize: 15, fontWeight: 700, color: colors.blue }}>🏢 Base compartida de sede (ciclo anterior)</div>
            </div>
            <div style={{ display: "flex", gap: 6, marginBottom: 8, flexWrap: "wrap" }}>
              <div style={{ flex: 1, minWidth: 80, background: colors.surface2, borderRadius: 8, padding: "8px 10px", textAlign: "center" }}>
                <div style={{ fontSize: 9, color: colors.textDim, fontWeight: 600, textTransform: "uppercase" }}>Base total</div>
                <div style={{ fontSize: 16, fontWeight: 800, color: colors.accent }}>{fmtNum(baseSede.saldo)}</div>
              </div>
              <div style={{ flex: 1, minWidth: 80, background: colors.surface2, borderRadius: 8, padding: "8px 10px", textAlign: "center" }}>
                <div style={{ fontSize: 9, color: colors.textDim, fontWeight: 600, textTransform: "uppercase" }}>Vendidos total</div>
                <div style={{ fontSize: 16, fontWeight: 800, color: colors.blue }}>−{fmtNum(totalVendidosCiclo)}</div>
              </div>
              <div style={{ flex: 1, minWidth: 80, background: colors.surface2, borderRadius: 8, padding: "8px 10px", textAlign: "center" }}>
                <div style={{ fontSize: 9, color: colors.textDim, fontWeight: 600, textTransform: "uppercase" }}>Devoluciones</div>
                <div style={{ fontSize: 16, fontWeight: 800, color: colors.purple }}>−{fmtNum(totalDevTokensCiclo)}</div>
              </div>
              <div style={{
                flex: 1, minWidth: 80, borderRadius: 8, padding: "8px 10px", textAlign: "center",
                background: totalSaldoEsperado >= 0 ? colors.greenDim : colors.redDim,
              }}>
                <div style={{ fontSize: 9, color: colors.textDim, fontWeight: 600, textTransform: "uppercase" }}>Debería quedar</div>
                <div style={{ fontSize: 16, fontWeight: 800, color: totalSaldoEsperado >= 0 ? colors.green : colors.red }}>{fmtNum(totalSaldoEsperado)}</div>
              </div>
            </div>
            <div style={{ fontSize: 11, color: colors.textDim, fontStyle: "italic" }}>
              En modo "base en sede" los 3 operadores comparten la base. Abajo se detalla cuánto vendió cada uno.
            </div>
          </div>
        )}

        {/* Tabla de trazabilidad por operador */}
        {operadorData.map((op, i) => {
          const tieneHistorial = op.historial !== null && !baseSede;
          const vendidosCiclo = op.vendidosEsteC;
          const devTokensCiclo = op.devTokensEsteC;
          const saldoEsperado = tieneHistorial ? op.historial.saldo - vendidosCiclo - devTokensCiclo : null;
          const estado = baseSede ? "sede" : saldoEsperado === null ? "sin_historial" : saldoEsperado >= 0 ? "ok" : "faltante";

          return (
            <div key={i} style={{
              background: colors.surface,
              border: `1px solid ${estado === "faltante" ? "rgba(239,68,68,0.3)" : colors.border}`,
              borderRadius: 12, padding: 16, marginBottom: 10,
            }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                <div style={{ fontSize: 15, fontWeight: 700, color: colors.textBright }}>{op.nombre}</div>
                {estado === "faltante" && <span style={S.badge(colors.red, colors.redDim)}>⚠️ FALTANTE</span>}
                {estado === "ok" && tieneHistorial && <span style={S.badge(colors.green, colors.greenDim)}>✓ OK</span>}
                {estado === "sin_historial" && <span style={S.badge(colors.accent, colors.accentDim)}>NUEVO</span>}
                {estado === "sede" && <span style={S.badge(colors.blue, colors.blueDim)}>🏢 SEDE</span>}
              </div>

              {tieneHistorial ? (
                <>
                  <div style={{ display: "flex", gap: 6, marginBottom: 8, flexWrap: "wrap" }}>
                    <div style={{ flex: 1, minWidth: 80, background: colors.surface2, borderRadius: 8, padding: "8px 10px", textAlign: "center" }}>
                      <div style={{ fontSize: 9, color: colors.textDim, fontWeight: 600, textTransform: "uppercase" }}>Saldo anterior</div>
                      <div style={{ fontSize: 16, fontWeight: 800, color: colors.accent }}>{fmtNum(op.historial.saldo)}</div>
                    </div>
                    <div style={{ flex: 1, minWidth: 80, background: colors.surface2, borderRadius: 8, padding: "8px 10px", textAlign: "center" }}>
                      <div style={{ fontSize: 9, color: colors.textDim, fontWeight: 600, textTransform: "uppercase" }}>Vendidos</div>
                      <div style={{ fontSize: 16, fontWeight: 800, color: colors.blue }}>−{fmtNum(vendidosCiclo)}</div>
                    </div>
                    <div style={{ flex: 1, minWidth: 80, background: colors.surface2, borderRadius: 8, padding: "8px 10px", textAlign: "center" }}>
                      <div style={{ fontSize: 9, color: colors.textDim, fontWeight: 600, textTransform: "uppercase" }}>Dev. Tokens</div>
                      <div style={{ fontSize: 16, fontWeight: 800, color: colors.purple }}>−{fmtNum(devTokensCiclo)}</div>
                    </div>
                    <div style={{
                      flex: 1, minWidth: 80, borderRadius: 8, padding: "8px 10px", textAlign: "center",
                      background: saldoEsperado >= 0 ? colors.greenDim : colors.redDim,
                    }}>
                      <div style={{ fontSize: 9, color: colors.textDim, fontWeight: 600, textTransform: "uppercase" }}>Debe tener</div>
                      <div style={{ fontSize: 16, fontWeight: 800, color: saldoEsperado >= 0 ? colors.green : colors.red }}>{fmtNum(saldoEsperado)}</div>
                    </div>
                  </div>

                  {saldoEsperado < 0 && (
                    <div style={S.alertBox("error")}>
                      {Icons.alert} ¡Vendió {Math.abs(saldoEsperado)} tokens más de los que tenía! Revisar posibles tokens no devueltos o liquidaciones incorrectas.
                    </div>
                  )}
                </>
              ) : baseSede ? (
                <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                  <div style={{ flex: 1, minWidth: 80, background: colors.surface2, borderRadius: 8, padding: "8px 10px", textAlign: "center" }}>
                    <div style={{ fontSize: 9, color: colors.textDim, fontWeight: 600, textTransform: "uppercase" }}>Vendidos</div>
                    <div style={{ fontSize: 16, fontWeight: 800, color: colors.blue }}>−{fmtNum(vendidosCiclo)}</div>
                  </div>
                  <div style={{ flex: 1, minWidth: 80, background: colors.surface2, borderRadius: 8, padding: "8px 10px", textAlign: "center" }}>
                    <div style={{ fontSize: 9, color: colors.textDim, fontWeight: 600, textTransform: "uppercase" }}>Dev. Tokens</div>
                    <div style={{ fontSize: 16, fontWeight: 800, color: colors.purple }}>−{fmtNum(devTokensCiclo)}</div>
                  </div>
                </div>
              ) : (
                <div style={{ fontSize: 12, color: colors.textDim, fontStyle: "italic" }}>
                  Sin historial del ciclo anterior. Vendió {fmtNum(vendidosCiclo)} tokens en este ciclo.
                </div>
              )}
            </div>
          );
        })}

        {/* Resumen global de tokens */}
        <div style={{ background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 12, padding: 16, marginTop: 6 }}>
          <div style={{ fontSize: 13, fontWeight: 700, color: colors.textBright, marginBottom: 10 }}>📊 Balance Global de Tokens</div>
          <div style={S.resultRow}>
            <span style={S.resultLabel}>Σ Saldos anteriores (todos los operadores)</span>
            <span style={S.resultValue}>{fmtNum(totalSaldoAnterior)}</span>
          </div>
          <div style={S.resultRow}>
            <span style={S.resultLabel}>Σ Vendidos este ciclo</span>
            <span style={{ ...S.resultValue, color: colors.blue }}>−{fmtNum(totalVendidosCiclo)}</span>
          </div>
          <div style={S.resultRow}>
            <span style={S.resultLabel}>Σ Dev. tokens este ciclo</span>
            <span style={{ ...S.resultValue, color: colors.purple }}>−{fmtNum(totalDevTokensCiclo)}</span>
          </div>
          <div style={S.resultRow}>
            <span style={S.resultLabel}>Tokens en máquinas (conteo físico)</span>
            <span style={S.resultValue}>+{fmtNum(tokensMaq)}</span>
          </div>
          <div style={S.divider} />
          <div style={{ ...S.resultRow, borderBottom: "none" }}>
            <span style={{ ...S.resultLabel, fontWeight: 700, color: tokensPerdidos === 0 ? colors.green : colors.red }}>
              {tokensPerdidos === 0 ? "✓ Sin faltantes" : `⚠️ Tokens no justificados`}
            </span>
            <span style={{ fontSize: 20, fontWeight: 800, color: tokensPerdidos === 0 ? colors.green : colors.red }}>
              {tokensPerdidos === 0 ? "0" : fmtNum(tokensPerdidos)}
            </span>
          </div>
          {tokensPerdidos > 0 && (
            <div style={{ fontSize: 11, color: colors.red, marginTop: 6, lineHeight: 1.5 }}>
              Estos tokens no están ni en las máquinas ni en los saldos de los operadores. Valor estimado en pérdida: <strong>{fmt(tokensPerdidos * 5000)}</strong> (a $5.000/token)
            </div>
          )}
        </div>
      </div>

      {/* ===== SECCIÓN 3: POOL ÚNICO Y REPARTICIÓN ===== */}
      <div style={S.card}>
        <div style={S.cardTitle}>🪙 Base de Tokens — Nuevo Ciclo</div>
        <div style={{ fontSize: 12, color: colors.textDim, marginBottom: 14, lineHeight: 1.6 }}>
          Todos los tokens (de máquinas + saldos de operadores) se unifican en una sola base.
        </div>

        <div style={{ display: "flex", gap: 8, marginBottom: 14, flexWrap: "wrap" }}>
          <div style={{ flex: 1, minWidth: "45%", background: colors.surface2, border: `1px solid ${colors.border}`, borderRadius: 10, padding: "12px 14px", textAlign: "center" }}>
            <div style={{ fontSize: 9, color: colors.textDim, fontWeight: 600, textTransform: "uppercase" }}>Tokens de máquinas</div>
            <div style={{ fontSize: 20, fontWeight: 800, color: colors.blue, marginTop: 4 }}>{fmtNum(tokensMaq)}</div>
          </div>
          <div style={{ flex: 1, minWidth: "45%", background: colors.surface2, border: `1px solid ${colors.border}`, borderRadius: 10, padding: "12px 14px", textAlign: "center" }}>
            <div style={{ fontSize: 9, color: colors.textDim, fontWeight: 600, textTransform: "uppercase" }}>Saldos de operadores</div>
            <div style={{ fontSize: 20, fontWeight: 800, color: colors.purple, marginTop: 4 }}>{fmtNum(totalSaldoEsperado)}</div>
          </div>
        </div>

        <div style={{
          background: colors.accentDim,
          border: `1px solid rgba(245,158,11,0.25)`,
          borderRadius: 12, padding: "16px", textAlign: "center",
        }}>
          <div style={{ fontSize: 10, color: colors.textDim, fontWeight: 700, textTransform: "uppercase", letterSpacing: 1 }}>Base total de tokens</div>
          <div style={{ fontSize: 32, fontWeight: 800, color: colors.accent, marginTop: 4 }}>{fmtNum(totalTokensDisponible)}</div>
          {ajusteNum !== 0 && (
            <div style={{ fontSize: 11, color: colors.textDim, marginTop: 4 }}>
              ({fmtNum(tokensMaq)} máq + {fmtNum(totalSaldoEsperado)} saldos {ajusteNum > 0 ? "+" : ""}{fmtNum(ajusteNum)} ajuste)
            </div>
          )}
        </div>
      </div>

      {/* Ajuste de tokens: retiros o ingresos */}
      <div style={S.card}>
        <div style={S.cardTitle}>🔄 Ajuste de Tokens (Retiros / Ingresos)</div>
        <div style={{ fontSize: 12, color: colors.textDim, marginBottom: 14, lineHeight: 1.6 }}>
          Si se retiraron tokens para llevar a otra sede o llegaron tokens de otro lugar, regístralo aquí. Usa número negativo para retiros (ej: -96) y positivo para ingresos (ej: 50).
        </div>

        <div style={S.row}>
          <div style={S.col}>
            <label style={S.label}>Cantidad (- retiro / + ingreso)</label>
            <input
              style={{ ...S.input, textAlign: "center", fontSize: 18, fontWeight: 700, borderColor: ajusteNum < 0 ? colors.red : ajusteNum > 0 ? colors.green : colors.border }}
              type="number" inputMode="numeric" placeholder="0"
              value={ajusteTokens}
              onChange={e => setAjusteTokens(e.target.value)}
            />
          </div>
        </div>

        {ajusteTokens !== "" && ajusteNum !== 0 && (
          <>
            <label style={S.label}>Motivo del ajuste</label>
            <input
              style={S.input}
              type="text" placeholder="Ej: Retiro para sede Marly, Ingreso desde Toberín..."
              value={ajusteMotivo}
              onChange={e => setAjusteMotivo(e.target.value)}
            />
          </>
        )}

        {ajusteNum < 0 && (
          <div style={S.alertBox("error")}>
            📤 Se retiran {fmtNum(Math.abs(ajusteNum))} tokens de esta sede. Base baja de {fmtNum(tokensMaq + totalSaldoEsperado)} a {fmtNum(totalTokensDisponible)}.
          </div>
        )}
        {ajusteNum > 0 && (
          <div style={S.alertBox("success")}>
            📥 Ingresan {fmtNum(ajusteNum)} tokens a esta sede. Base sube de {fmtNum(tokensMaq + totalSaldoEsperado)} a {fmtNum(totalTokensDisponible)}.
          </div>
        )}
      </div>

      {/* Toggle modo de repartición */}
      <div style={S.card}>
        <div style={S.cardTitle}>📤 ¿Cómo repartir los tokens?</div>
        <div style={{ display: "flex", gap: 8 }}>
          <button
            style={{
              flex: 1, padding: "14px 10px", borderRadius: 12, border: "2px solid",
              borderColor: modoReparto === "operadores" ? colors.accent : colors.border,
              background: modoReparto === "operadores" ? colors.accentDim : colors.surface2,
              color: modoReparto === "operadores" ? colors.accent : colors.textDim,
              cursor: "pointer", fontFamily: "inherit", fontWeight: 700, fontSize: 13,
            }}

          </div>

          {reparto.map((r, i) => (
            <div key={i} style={{

              </div>
              <div style={{ width: 110 }}>
                <input
                  style={{ ...S.input, marginBottom: 0, textAlign: "center", fontWeight: 700, fontSize: 16 }}
                  type="number" inputMode="numeric" placeholder="0"
                  value={r.tokens}
                  onChange={e => {
                    const arr = [...reparto];
                    arr[i].tokens = e.target.value;
                    setReparto(arr);
                  }}
                />
              </div>
              <span style={{ fontSize: 12, color: colors.textDim }}>tok</span>
            </div>
          ))}

          <div style={S.divider} />

          <div style={S.resultRow}>
            <span style={S.resultLabel}>Total repartido</span>
            <span style={S.resultValue}>{fmtNum(totalTokensRepartido)}</span>
          </div>
          <div style={S.resultRow}>
            <span style={S.resultLabel}>Base de tokens</span>
            <span style={S.resultValue}>{fmtNum(totalTokensDisponible)}</span>
          </div>
          <div style={{ ...S.resultRow, borderBottom: "none" }}>
            <span style={{ ...S.resultLabel, fontWeight: 700 }}>Restante sin repartir</span>
            <span style={{ ...S.resultValue, color: tokensRestante === 0 ? colors.green : tokensRestante > 0 ? colors.accent : colors.red, fontSize: 20 }}>
              {fmtNum(tokensRestante)}
            </span>
          </div>

          {tokensRestante === 0 && totalTokensRepartido > 0 && (
            <div style={S.alertBox("success")}>{Icons.check} Todos los tokens de la base repartidos</div>
          )}
          {tokensRestante > 0 && totalTokensRepartido > 0 && (
            <div style={S.alertBox("info")}>⚠️ Quedan {fmtNum(tokensRestante)} tokens sin asignar</div>
          )}
          {tokensRestante < 0 && (
            <div style={S.alertBox("error")}>{Icons.alert} Se repartieron {fmtNum(Math.abs(tokensRestante))} tokens más de los disponibles</div>
          )}
        </div>
      )}

      {modoReparto === "sede" && (
        <div style={S.card}>
          <div style={S.cardTitle}>🏢 Base Completa en Sede</div>
          <div style={{ fontSize: 12, color: colors.textDim, marginBottom: 14, lineHeight: 1.6 }}>
            Los {fmtNum(totalTokensDisponible)} tokens quedan como base en la sede. Los operadores toman tokens de esta base según necesiten.
          </div>
          <div style={S.alertBox("success")}>
            {Icons.check} Se dejarán {fmtNum(totalTokensDisponible)} tokens como base en {sede}
          </div>
        </div>
      )}

      <button style={S.btnPrimary} onClick={handleSave}>
        {Icons.save} Confirmar Repartición y Base
      </button>
    </div>
  );
}

function ResumenFinal({ ciclo, totales, liquidaciones, maquinas, gastos, tokenReparto, onNewCiclo }) {
  const reportRef = React.createRef();
  const [generandoPDF, setGenerandoPDF] = useState(false);

  const generarPDF = async () => {
    setGenerandoPDF(true);
    try {
      const el = reportRef.current;
      const canvas = await html2canvas(el, {
        backgroundColor: '#080c14',
        scale: 2,
        useCORS: true,
        logging: false,
      });
      const imgData = canvas.toDataURL('image/jpeg', 0.95);
      const { jsPDF } = window.jspdf;
      const pdfWidth = 210; // A4 mm
      const imgWidth = pdfWidth - 20; // 10mm márgenes
      const imgHeight = (canvas.height * imgWidth) / canvas.width;
      const pdf = new jsPDF('p', 'mm', 'a4');
      let posY = 10;
      const pageHeight = 287; // A4 alto útil

      // Si la imagen es más alta que una página, dividir
      if (imgHeight <= pageHeight) {
        pdf.addImage(imgData, 'JPEG', 10, posY, imgWidth, imgHeight);
      } else {
        // Multipágina
        let remainingHeight = canvas.height;
        let sourceY = 0;
        const sliceHeight = Math.floor(canvas.width * pageHeight / imgWidth);
        let page = 0;
        while (remainingHeight > 0) {
          if (page > 0) pdf.addPage();
          const sliceCanvas = document.createElement('canvas');
          sliceCanvas.width = canvas.width;
          sliceCanvas.height = Math.min(sliceHeight, remainingHeight);
          const ctx = sliceCanvas.getContext('2d');
          ctx.drawImage(canvas, 0, sourceY, canvas.width, sliceCanvas.height, 0, 0, canvas.width, sliceCanvas.height);
          const sliceImg = sliceCanvas.toDataURL('image/jpeg', 0.95);
          const sliceImgH = (sliceCanvas.height * imgWidth) / sliceCanvas.width;
          pdf.addImage(sliceImg, 'JPEG', 10, 10, imgWidth, sliceImgH);
          sourceY += sliceHeight;
          remainingHeight -= sliceHeight;
          page++;
        }
      }

      const fileName = `Panzer_${ciclo.sede}_${ciclo.fecha.replace(/\//g, '-')}.pdf`;

      // En celular: intentar compartir por WhatsApp si está disponible
      if (navigator.share && navigator.canShare) {
        const blob = pdf.output('blob');
        const file = new File([blob], fileName, { type: 'application/pdf' });
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({
            title: 'Reporte Panzer Carwash - ' + ciclo.sede,
            text: 'Reporte de recaudo ' + ciclo.sede + ' - ' + ciclo.fecha,
            files: [file],
          });
          setGenerandoPDF(false);
          return;
        }
      }
      // Fallback: descarga directa
      pdf.save(fileName);
    } catch (e) {
      console.error('Error generando PDF:', e);
      alert('Error al generar el PDF. Intenta de nuevo.');
    }
    setGenerandoPDF(false);
  };

  return (
    <div>
      {/* Botones de acción arriba */}
      <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
        <button
          style={{ ...S.btnPrimary, background: `linear-gradient(135deg, #25D366, #128C7E)`, flex: 1 }}
          onClick={generarPDF}
          disabled={generandoPDF}
        >
          {generandoPDF ? "⏳ Generando..." : "📤 Descargar / Compartir PDF"}
        </button>
      </div>

      {/* Contenido del reporte que se captura como PDF */}
      <div ref={reportRef} style={{ background: colors.bg, padding: 4 }}>

        {/* Header del reporte */}
        <div style={{
          background: `linear-gradient(135deg, ${colors.surface}, ${colors.surface2})`,
          border: `1px solid ${colors.accent}`,
          borderRadius: 14, padding: 20, marginBottom: 14, textAlign: "center",
        }}>
          <div style={{ fontSize: 20, fontWeight: 800, color: colors.accent, marginBottom: 4 }}>PANZER CARWASH</div>
          <div style={{ fontSize: 14, color: colors.textDim, marginBottom: 12 }}>Reporte de Recaudo</div>
          <div style={{ display: "flex", justifyContent: "space-around", flexWrap: "wrap", gap: 8 }}>
            <div><div style={{ fontSize: 10, color: colors.textDim }}>SEDE</div><div style={{ fontSize: 15, fontWeight: 700, color: colors.textBright }}>{ciclo.sede}</div></div>
            <div><div style={{ fontSize: 10, color: colors.textDim }}>TESORERO</div><div style={{ fontSize: 15, fontWeight: 700, color: colors.textBright }}>{ciclo.tesorero}</div></div>
            <div><div style={{ fontSize: 10, color: colors.textDim }}>FECHA</div><div style={{ fontSize: 15, fontWeight: 700, color: colors.textBright }}>{ciclo.fecha}</div></div>
          </div>
        </div>

        {/* Valor a consignar destacado */}
        <div style={{
          background: colors.greenDim, border: "1px solid rgba(16,185,129,0.3)",
          borderRadius: 14, padding: 20, marginBottom: 14, textAlign: "center",

              <div style={S.resultRow}>
                <span style={{ ...S.resultLabel, color: tokenReparto.ajusteTokens < 0 ? colors.red : colors.green }}>
                  {tokenReparto.ajusteTokens < 0 ? "📤 Retiro" : "📥 Ingreso"} tokens {tokenReparto.ajusteMotivo ? `(${tokenReparto.ajusteMotivo})` : ""}
                </span>
                <span style={{ ...S.resultValue, color: tokenReparto.ajusteTokens < 0 ? colors.red : colors.green }}>
                  {tokenReparto.ajusteTokens > 0 ? "+" : ""}{fmtNum(tokenReparto.ajusteTokens)}
                </span>
              </div>
            )}
            <div style={S.resultRow}>
              <span style={S.resultLabel}>Modo</span>
              <span style={{ ...S.resultValue, fontSize: 13 }}>
                {tokenReparto.modoReparto === "sede" ? "🏢 Base completa en sede" : "👥 Repartido entre operadores"}
              </span>
            </div>

            {tokenReparto.modoReparto === "operadores" && tokenReparto.operadores && tokenReparto.operadores.length > 0 && (
              <>
                <div style={S.divider} />
                {tokenReparto.operadores.map((r, i) => (
                  <div key={i} style={S.resultRow}>
                    <span style={S.resultLabel}>{r.nombre}</span>
                    <span style={S.resultValue}>{fmtNum(r.tokens)} tokens</span>
                  </div>
                ))}
              </>
            )}

            <div style={S.divider} />

            <div style={{ fontSize: 12, fontWeight: 700, color: colors.textDim, marginBottom: 8, letterSpacing: 0.5, textTransform: "uppercase" }}>Base de efectivo</div>
            <div style={S.resultRow}>
              <span style={S.resultLabel}>Base recogida</span>
              <span style={S.resultValue}>{fmt(tokenReparto.baseRecogida)}</span>
            </div>
            <div style={{ ...S.resultRow, borderBottom: "none" }}>
              <span style={S.resultLabel}>Base nueva dejada</span>
              <span style={{ ...S.resultValue, color: colors.green }}>{fmt(tokenReparto.baseNueva)}</span>
            </div>
          </div>
        )}

        {/* Pie de reporte */}
        <div style={{ textAlign: "center", padding: "16px 0 8px", fontSize: 11, color: colors.textDim }}>
          Panzer Carwash — Reporte generado el {new Date().toLocaleDateString("es-CO")} a las {new Date().toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" })}
        </div>

      </div>{/* Fin del contenido capturado para PDF */}

      {/* Botón compartir abajo también */}
      <div style={{ marginTop: 14, display: "flex", gap: 8 }}>
        <button
          style={{ ...S.btnPrimary, background: `linear-gradient(135deg, #25D366, #128C7E)`, flex: 1 }}
          onClick={generarPDF}
          disabled={generandoPDF}
        >
          {generandoPDF ? "⏳ Generando..." : "📤 Descargar / Compartir PDF"}
        </button>
      </div>

      <button style={{ ...S.btnPrimary, marginTop: 10 }} onClick={onNewCiclo}>
        🚀 Iniciar Nuevo Ciclo
      </button>
    </div>
  );
}


// ============================================================
// RENDER
// ============================================================
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
document.getElementById('loading').style.display = 'none';
  </script>
</body>
</html>
